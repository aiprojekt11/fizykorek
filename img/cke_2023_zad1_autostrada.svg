<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bg2023" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrowHighway" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="740" height="440" rx="16" fill="url(#bg2023)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="25" y="20" width="370" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="38" y="41" fill="#38bdf8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" font-size="13">CKE Matura 2023 • Zadanie 1 (Samochody P i F)</text>

  <!-- Highway Representation (Top) -->
  <g transform="translate(30, 80)">
    <!-- Road surface -->
    <rect width="680" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Lane divider dashed -->
    <line x1="20" y1="55" x2="660" y2="55" stroke="#475569" stroke-width="2" stroke-dasharray="14,14"/>

    <!-- Car P at t=0 (x=0) -->
    <g transform="translate(80, 20)">
      <rect x="0" y="0" width="55" height="26" rx="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
      <text x="27" y="18" text-anchor="middle" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">P</text>
      <!-- Velocity vector v_0P -->
      <line x1="55" y1="13" x2="110" y2="13" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHighway)"/>
      <text x="70" y="-4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">v_0P = 20 m/s</text>
      <text x="70" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">a_P = 6 m/s²</text>
    </g>

    <!-- Car F at t=0 (x=40m) -->
    <g transform="translate(240, 65)">
      <rect x="0" y="0" width="55" height="26" rx="5" fill="#fb923c" stroke="#ffffff" stroke-width="1"/>
      <text x="27" y="18" text-anchor="middle" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">F</text>
      <!-- Velocity vector v_F -->
      <line x1="55" y1="13" x2="140" y2="13" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
      <text x="80" y="-4" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10">v_F = 35 m/s (const)</text>
    </g>

    <!-- Distance d_0 at t=0 -->
    <line x1="107" y1="125" x2="267" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="107" y1="120" x2="107" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="267" y1="120" x2="267" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="187" y="140" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">d_0 = 40 m</text>
  </g>

  <!-- Kinematic Graphs & Analysis Cards (Bottom) -->
  <g transform="translate(30, 245)">
    <!-- Formula Box 1: Car P -->
    <rect x="0" y="0" width="330" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="20" y="28" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Samochód P (ruch jednostajnie przyspieszony)</text>
    <text x="20" y="58" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">x_P(t) = 20·t + 3·t²</text>
    <text x="20" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">v_P(t) = 20 + 6·t</text>
    <text x="20" y="118" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">W chwili t=0: x_0P = 0, v_0P = 20 m/s</text>
    <text x="20" y="138" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Przyspieszenie: a = 2·3 = 6 m/s²</text>

    <!-- Formula Box 2: Car F -->
    <rect x="350" y="0" width="330" height="160" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.2"/>
    <text x="370" y="28" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Samochód F (ruch jednostajny)</text>
    <text x="370" y="58" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">x_F(t) = 40 + 35·t</text>
    <text x="370" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">v_F(t) = 35 m/s = const</text>
    <text x="370" y="118" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Warunek max odległości: v_P(t) = v_F(t)</text>
    <text x="370" y="138" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">20 + 6t = 35 ⟹ t_max = 2,5 s (d_max = 58,75 m)</text>
  </g>
</svg>
