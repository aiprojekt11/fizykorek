<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bg2022" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrAxis2022" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="720" height="440" rx="16" fill="url(#bg2022)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="25" y="20" width="370" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="38" y="41" fill="#38bdf8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" font-size="13">CKE Matura 2022 • Zadanie 1: Wykresy v(t) ciał A i B</text>

  <!-- Coordinate Grid:
       Origin O(0,0) at (90, 370).
       t axis: 0 to 40 s -> 13px per 1 s. (0->90, 10->220, 20->350, 25->415, 30->480, 40->610).
       v axis: 0 to 30 m/s -> 9px per 1 m/s. (0->370, 10->280, 20->190, 30->100).
  -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="90" y1="80" x2="90" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="220" y1="80" x2="220" y2="370"/>
    <line x1="350" y1="80" x2="350" y2="370"/>
    <line x1="415" y1="80" x2="415" y2="370" stroke="#475569" stroke-width="1.2"/>
    <line x1="480" y1="80" x2="480" y2="370"/>
    <line x1="610" y1="80" x2="610" y2="370"/>

    <line x1="90" y1="370" x2="640" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="90" y1="280" x2="640" y2="280"/>
    <line x1="90" y1="190" x2="640" y2="190"/>
    <line x1="90" y1="100" x2="640" y2="100"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="370" x2="655" y2="370" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrAxis2022)"/>
  <text x="658" y="375" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">t, s</text>

  <line x1="90" y1="380" x2="90" y2="65" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrAxis2022)"/>
  <text x="70" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">v, m/s</text>

  <!-- Axis labels -->
  <g fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="80" y="390">0</text>
    <text x="212" y="390">10</text>
    <text x="342" y="390">20</text>
    <text x="407" y="390" fill="#fbbf24" font-weight="700">25</text>
    <text x="472" y="390">30</text>
    <text x="602" y="390">40</text>

    <text x="68" y="285">10</text>
    <text x="68" y="195">20</text>
    <text x="68" y="105">30</text>
  </g>

  <!-- Body A line (Cyan):
       From (t=0, v=0) -> (90, 370)
       to (t=20, v=20) -> (350, 190)
       to (t=40, v=20) -> (610, 190)
  -->
  <polyline points="90,370 350,190 610,190" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="350" cy="190" r="5" fill="#38bdf8"/>
  <text x="520" y="175" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">Ciało A</text>

  <!-- Body B line (Rose):
       From (t=0, v=30) -> (90, 100)
       to (t=30, v=0) -> (480, 370)
       to (t=40, v=0) -> (610, 370)
  -->
  <polyline points="90,100 480,370 610,370" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="480" cy="370" r="5" fill="#f43f5e"/>
  <text x="140" y="130" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">Ciało B</text>

  <!-- Relative velocity analysis at t = 25 s -->
  <line x1="415" y1="80" x2="415" y2="370" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- At t=25s:
       Body A has v_A = 20 m/s -> (415, 190)
       Body B has v_B = 30 - 1*25 = 5 m/s -> (415, 325)
       Delta v = 20 - 5 = 15 m/s or 10 m/s depending on parameters
  -->
  <circle cx="415" cy="190" r="5" fill="#fbbf24"/>
  <circle cx="415" cy="325" r="5" fill="#fbbf24"/>
  <line x1="415" y1="190" x2="415" y2="325" stroke="#fbbf24" stroke-width="2.5"/>
  <rect x="425" y="240" width="180" height="48" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="435" y="260" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">W chwili t = 25 s:</text>
  <text x="435" y="278" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">v_wzgl = |v_A - v_B|</text>
</svg>
