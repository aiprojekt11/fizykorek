<title id="title">Zwrot momentu pędu obracającej się tarczy</title><desc id="desc">Dla obrotu zgodnego z ruchem wskazówek zegara wektor momentu pędu jest skierowany wzdłuż osi obrotu w głąb kartki, co oznaczono krzyżykiem w okręgu.</desc>
