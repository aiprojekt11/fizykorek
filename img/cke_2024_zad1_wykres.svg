<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" height="auto">
  <defs>
    <linearGradient id="bg2024" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrow2024" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Container -->
  <rect width="740" height="500" rx="16" fill="url(#bg2024)" stroke="#334155" stroke-width="1.5"/>

  <!-- Badge Header -->
  <rect x="25" y="20" width="310" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="38" y="41" fill="#38bdf8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" font-size="13">CKE Matura 2024 • Zadanie 1: Wykres v(t)</text>

  <!-- Left: Main v(t) graph
       Width: 440px, Height: 380px.
       Origin O(0,0) at (80, 420).
       t axis: 0 to 4 s -> 80px per 1 s. (t=0 -> 80, t=1 -> 160, t=2 -> 240, t=3 -> 320, t=4 -> 400).
       v axis: 0 to 8 m/s -> 45px per 1 m/s. (v=0 -> 420, v=4 -> 240, v=6 -> 150, v=7 -> 105, v=8 -> 60).
  -->
  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3">
    <!-- Vertical grid lines -->
    <line x1="80" y1="60" x2="80" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="160" y1="60" x2="160" y2="420"/>
    <line x1="240" y1="60" x2="240" y2="420"/>
    <line x1="320" y1="60" x2="320" y2="420"/>
    <line x1="400" y1="60" x2="400" y2="420"/>

    <!-- Horizontal grid lines -->
    <line x1="80" y1="420" x2="430" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="80" y1="375" x2="430" y2="375"/>
    <line x1="80" y1="330" x2="430" y2="330"/>
    <line x1="80" y1="285" x2="430" y2="285"/>
    <line x1="80" y1="240" x2="430" y2="240"/>
    <line x1="80" y1="195" x2="430" y2="195"/>
    <line x1="80" y1="150" x2="430" y2="150"/>
    <line x1="80" y1="105" x2="430" y2="105" stroke="#475569" stroke-width="1.2"/>
    <line x1="80" y1="60" x2="430" y2="60"/>
  </g>

  <!-- Axes -->
  <line x1="70" y1="420" x2="445" y2="420" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow2024)"/>
  <text x="448" y="425" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">t, s</text>

  <line x1="80" y1="430" x2="80" y2="45" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow2024)"/>
  <text x="60" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">v, m/s</text>

  <!-- Axis numbers -->
  <g fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="70" y="438">0</text>
    <text x="155" y="438">1</text>
    <text x="235" y="438">2</text>
    <text x="315" y="438">3</text>
    <text x="395" y="438">4</text>

    <text x="60" y="380">1</text>
    <text x="60" y="335">2</text>
    <text x="60" y="290">3</text>
    <text x="60" y="245">4</text>
    <text x="60" y="200">5</text>
    <text x="60" y="155">6</text>
    <text x="60" y="110" fill="#38bdf8" font-weight="700">7</text>
  </g>

  <!-- v(t) curve with points A, B, C, D, E, F -->
  <!-- A: (0, 0) -> (80, 420)
       B: (1, 4) -> (160, 240)
       C: (2, 6) -> (240, 150)
       D: (3, 7) -> (320, 105)
       E: (3.6, 7) -> (368, 105)
       F: (4, 7) -> (400, 105)
  -->
  <!-- Shaded area for distance estimation under curve -->
  <path d="M 80 420 Q 140 280, 160 240 T 240 150 Q 280 115, 320 105 L 400 105 L 400 420 Z" fill="rgba(56, 189, 248, 0.08)"/>

  <!-- Curve line -->
  <path d="M 80 420 Q 140 280, 160 240 T 240 150 Q 280 115, 320 105 L 400 105" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Points and labels -->
  <!-- A -->
  <circle cx="80" cy="420" r="5" fill="#f8fafc"/>
  <text x="90" y="415" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">A</text>
  <!-- B -->
  <circle cx="160" cy="240" r="5" fill="#f8fafc"/>
  <text x="170" y="235" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">B (1 s; 4 m/s)</text>
  <!-- C -->
  <circle cx="240" cy="150" r="5" fill="#f8fafc"/>
  <text x="250" y="145" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">C (2 s; 6 m/s)</text>
  <!-- D -->
  <circle cx="320" cy="105" r="5" fill="#f8fafc"/>
  <text x="305" y="90" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">D</text>
  <!-- E -->
  <circle cx="368" cy="105" r="4" fill="#fbbf24"/>
  <text x="360" y="90" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12">E (3,6 s)</text>
  <!-- F -->
  <circle cx="400" cy="105" r="5" fill="#f8fafc"/>
  <text x="408" y="95" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">F (4 s)</text>

  <!-- Right: Force Diagrams (Zadanie 1.2) -->
  <g transform="translate(480, 80)">
    <rect width="235" height="370" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="117" y="28" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Diagramy sił (Zadanie 1.2)</text>

    <!-- Diagram 1: t = 3,6 s (ruch jednostajny, F_op = F_g) -->
    <g transform="translate(60, 130)">
      <text x="0" y="-70" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Diagram 1: t = 3,6 s</text>
      <!-- Grid box 4x4 kratek -->
      <rect x="-35" y="-60" width="70" height="120" fill="rgba(255,255,255,0.02)" stroke="#334155" stroke-width="1"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#475569" stroke-width="1"/>
      <!-- Drop point K -->
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <text x="8" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">K</text>
      <!-- F_g vector down (length 45) -->
      <line x1="0" y1="0" x2="0" y2="45" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow2024)"/>
      <text x="6" y="35" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">F⃗_g</text>
      <!-- F_opE vector up (length 45, equal to F_g) -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowPink)"/>
      <text x="6" y="-30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">F⃗_opE</text>
      <text x="0" y="80" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">F_op = F_g</text>
    </g>

    <!-- Diagram 2: t = 0,4 s (v = 3.5 m/s = v_gran/2 -> F_op = 1/4 F_g) -->
    <g transform="translate(175, 130)">
      <text x="0" y="-70" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Diagram 2: t = 0,4 s</text>
      <rect x="-35" y="-60" width="70" height="120" fill="rgba(255,255,255,0.02)" stroke="#334155" stroke-width="1"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#475569" stroke-width="1"/>
      <!-- Drop point K -->
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      <text x="8" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">K</text>
      <!-- F_g vector down (length 45) -->
      <line x1="0" y1="0" x2="0" y2="45" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow2024)"/>
      <text x="6" y="35" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">F⃗_g</text>
      <!-- F_opB vector up (length 45/4 ≈ 11px) -->
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowPink)"/>
      <text x="6" y="-12" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">F⃗_opB</text>
      <text x="0" y="80" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">F_op = ¼ F_g</text>
    </g>

    <text x="117" y="335" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Siła oporu: F_op ∝ v²</text>
  </g>
</svg>
