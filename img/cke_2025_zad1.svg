<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="auto">
  <defs>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowHeadRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowHeadGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowHeadYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="700" height="480" rx="16" fill="url(#gridGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="25" y="20" width="280" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="38" y="41" fill="#38bdf8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" font-size="13">CKE Matura 2025 • Zadanie 1 (Rysunek)</text>

  <!-- Coordinate Grid (Origin at x=80, y=410, scale: 45px per 1m horizontally, 25px per 1m vertically) -->
  <!-- We want x from 0 to 12, y from 0 to 14. Let:
       Origin O(0,0) at (90, 420).
       Scale X: 42px per 1m -> x=6m is at 90 + 6*42 = 342. x=12m is at 90 + 12*42 = 594.
       Scale Y: 26px per 1m -> y=12m is at 420 - 12*26 = 108. y=14m is at 420 - 14*26 = 56.
  -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3">
    <!-- Vertical grid lines (every 2m: 0, 2, 4, 6, 8, 10, 12) -->
    <line x1="90" y1="70" x2="90" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="174" y1="70" x2="174" y2="420"/>
    <line x1="258" y1="70" x2="258" y2="420"/>
    <line x1="342" y1="70" x2="342" y2="420" stroke="#475569" stroke-width="1.2"/>
    <line x1="426" y1="70" x2="426" y2="420"/>
    <line x1="510" y1="70" x2="510" y2="420"/>
    <line x1="594" y1="70" x2="594" y2="420"/>

    <!-- Horizontal grid lines (every 2m: 0, 2, 4, 6, 8, 10, 12, 14) -->
    <line x1="90" y1="420" x2="630" y2="420" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
    <line x1="90" y1="368" x2="630" y2="368"/>
    <line x1="90" y1="316" x2="630" y2="316"/>
    <line x1="90" y1="264" x2="630" y2="264"/>
    <line x1="90" y1="212" x2="630" y2="212"/>
    <line x1="90" y1="160" x2="630" y2="160"/>
    <line x1="90" y1="108" x2="630" y2="108" stroke="#475569" stroke-width="1.2"/>
    <line x1="90" y1="56" x2="630" y2="56"/>
  </g>

  <!-- Axes lines with arrows -->
  <!-- X Axis -->
  <line x1="80" y1="420" x2="650" y2="420" stroke="#cbd5e1" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="655" y="425" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">x, m</text>

  <!-- Y Axis -->
  <line x1="90" y1="430" x2="90" y2="45" stroke="#cbd5e1" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="75" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">y, m</text>

  <!-- Axis Labels -->
  <g fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="80" y="438">0</text>
    <text x="170" y="438">2</text>
    <text x="254" y="438">4</text>
    <text x="338" y="438" fill="#38bdf8" font-weight="700">6</text>
    <text x="422" y="438">8</text>
    <text x="502" y="438">10</text>
    <text x="586" y="438">12</text>

    <text x="70" y="372">2</text>
    <text x="70" y="320">4</text>
    <text x="70" y="268">6</text>
    <text x="70" y="216">8</text>
    <text x="65" y="164">10</text>
    <text x="65" y="112" fill="#f43f5e" font-weight="700">12</text>
  </g>

  <!-- Point A (0, 12) -> (90, 108) -->
  <circle cx="90" cy="108" r="7" fill="#f43f5e"/>
  <text x="55" y="103" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">A (0; 12)</text>
  <!-- Vector v_0A horizontal -->
  <line x1="90" y1="108" x2="190" y2="108" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrowHeadRed)"/>
  <text x="130" y="96" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">v⃗_0A = 8 m/s</text>

  <!-- Point B (6, 0) -> (342, 420) -->
  <circle cx="342" cy="420" r="7" fill="#10b981"/>
  <text x="355" y="436" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">B (6; 0)</text>
  <!-- Vector v_0B vertical up -->
  <line x1="342" y1="420" x2="342" y2="300" stroke="#10b981" stroke-width="3" marker-end="url(#arrowHeadGreen)"/>
  <text x="352" y="360" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">v⃗_0B</text>

  <!-- Trajectory of kulka A: Parabola from (90, 108) to C(342, y_C)
       At x=6m (t=0.75s), y = 12 - 0.5*9.81*(0.75)^2 = 9.24m.
       In pixels: 420 - 9.24*26 = 179.7 px.
  -->
  <path d="M 90 108 Q 230 115 342 180" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Vertical trajectory of kulka B from (342, 420) up to C (342, 180) -->
  <line x1="342" y1="420" x2="342" y2="180" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Collision Point C (6; y_C) at (342, 180) -->
  <circle cx="342" cy="180" r="8" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <text x="358" y="175" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">C (6; y_C)</text>
  <text x="358" y="195" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">Punkt zderzenia w chwili t_z</text>

  <!-- Vector g gravity downward -->
  <g transform="translate(540, 120)">
    <rect x="-10" y="-10" width="100" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <line x1="40" y1="15" x2="40" y2="65" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
    <text x="15" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13">g⃗</text>
    <text x="5" y="75" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">9,81 m/s²</text>
  </g>
</svg>
