<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 460" width="1024" height="460">
  <defs>
    <!-- Markery strzałek -->
    <marker id="arr-dark" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto">
      <polygon points="0 0, 7 2.75, 0 5.5" fill="#182c40" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1261a0" />
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14736b" />
    </marker>

    <style>
      .math {
        font-family: 'KaTeX_Math', 'Latin Modern Math', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: italic;
        fill: #182c40;
      }
      .math-rm {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: normal;
        fill: #182c40;
      }
      .text-heading {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 17.5px;
        fill: #182c40;
      }
      .text-body {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 15px;
        fill: #182c40;
      }
      .text-muted {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 13.5px;
        fill: #64778a;
      }

      .blue   { fill: #1261a0; }
      .teal   { fill: #14736b; }
      .orange { fill: #b65512; }
      .slate  { fill: #64778a; }

      .body-light { fill: #f5f8fb; stroke: #64778a; stroke-width: 2; }
      .body-side  { fill: #e6eef5; stroke: #64778a; stroke-width: 2; }
      .body-dense { fill: #dce5ed; stroke: #64778a; stroke-width: 2; }
      .ground     { stroke: #64778a; stroke-width: 2.2; stroke-linecap: round; }
      .hatch      { stroke: #cbd2d8; stroke-width: 1.2; }
      .dim-line   { stroke: #768798; stroke-width: 1.4; }
      .card       { fill: #f2f6f9; rx: 12px; }
    </style>
  </defs>

  <!-- Tło -->
  <rect width="1024" height="460" fill="#ffffff" />

  <!-- ===================================================================== -->
  <!-- LEWA STRONA: SCHEMAT TOCZĄCEGO SIĘ WALCA / KOŁA (x = 230)            -->
  <!-- ===================================================================== -->
  <g transform="translate(230, 0)">
    <!-- Podłoże z kreskowaniem -->
    <line x1="-170" y1="230" x2="170" y2="230" class="ground" />
    <g class="hatch">
      <line x1="-160" y1="230" x2="-170" y2="242" />
      <line x1="-130" y1="230" x2="-140" y2="242" />
      <line x1="-100" y1="230" x2="-110" y2="242" />
      <line x1="-70" y1="230" x2="-80" y2="242" />
      <line x1="-40" y1="230" x2="-50" y2="242" />
      <line x1="-10" y1="230" x2="-20" y2="242" />
      <line x1="20" y1="230" x2="10" y2="242" />
      <line x1="50" y1="230" x2="40" y2="242" />
      <line x1="80" y1="230" x2="70" y2="242" />
      <line x1="110" y1="230" x2="100" y2="242" />
      <line x1="140" y1="230" x2="130" y2="242" />
    </g>

    <!-- Koło / Walec (promień R = 85, środek cy = 145) -->
    <circle cx="0" cy="145" r="85" class="body-light" />
    <circle cx="0" cy="145" r="72" fill="none" stroke="#dce5ed" stroke-width="1.8" />

    <!-- Środek masy O / S -->
    <circle cx="0" cy="145" r="4.5" fill="#182c40" />
    <text x="-16" y="141" class="math" font-size="18">O</text>

    <!-- Promień R (skierowany ukośnie w dół-lewo) -->
    <line x1="0" y1="145" x2="-60" y2="205" stroke="#14736b" stroke-width="2" marker-end="url(#arr-teal)" />
    <text x="-40" y="172" class="math teal" font-size="19">R</text>

    <!-- Wektor prędkości środka masy v (niebieski poziomy w prawo) -->
    <line x1="0" y1="145" x2="90" y2="145" stroke="#1261a0" stroke-width="3.2" marker-end="url(#arr-blue)" />
    <text x="98" y="141" class="math blue" font-size="22">v</text>
    <text x="18" y="132" class="text-muted blue" font-size="13">ruch postępowy</text>

    <!-- Strzałka obrotu omega wokół środka (zgodnie z ruchem wskazówek zegara) -->
    <path d="M -45 110 A 55 55 0 0 1 45 110" fill="none" stroke="#14736b" stroke-width="2.2" marker-end="url(#arr-teal)" />
    <text x="0" y="96" text-anchor="middle" class="math teal" font-size="21">ω</text>
    <text x="0" y="78" text-anchor="middle" class="text-muted teal" font-size="13">ruch obrotowy</text>

    <!-- Punkt styku z podłożem C -->
    <circle cx="0" cy="230" r="4" fill="#182c40" />
    <text x="8" y="246" class="math" font-size="17">C</text>
    <text x="-12" y="246" text-anchor="end" class="text-muted" font-size="12">v<tspan font-size="10" dy="2">C</tspan><tspan dy="-2"> = 0</tspan></text>

    <!-- Masa bryły m -->
    <text x="-48" y="141" class="math slate" font-size="19">m</text>

    <!-- Podpis na dole schematu -->
    <text x="0" y="276" text-anchor="middle" class="text-heading" font-size="16px">Warunek toczenia bez poślizgu: <tspan class="math teal">v = ωR</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- PRAWA STRONA: ROZBICIE I BILANS ENERGII (x = 480 .. 980)             -->
  <!-- ===================================================================== -->
  <g transform="translate(470, 30)">
    <!-- Główna karta z definicją całkowitej energii -->
    <rect x="0" y="0" width="510" height="240" class="card" />

    <text x="24" y="34" class="text-heading">Całkowita energia kinetyczna bryły toczącej się</text>

    <!-- Wzór główny: E_k = E_k,post + E_k,obr -->
    <g transform="translate(30, 75)">
      <text x="0" y="0" class="math" font-size="26">E</text>
      <text x="14" y="5" class="math-rm" font-size="16">k</text>
      <text x="32" y="0" class="math-rm" font-size="24">=</text>

      <text x="56" y="0" class="math blue" font-size="26">E</text>
      <text x="70" y="5" class="math-rm blue" font-size="14">k,post</text>
      <text x="116" y="0" class="math-rm" font-size="24">+</text>

      <text x="138" y="0" class="math teal" font-size="26">E</text>
      <text x="152" y="5" class="math-rm teal" font-size="14">k,obr</text>
    </g>

    <!-- Rozpisanie ze wzorami: 1/2 mv^2 + 1/2 I omega^2 -->
    <g transform="translate(30, 125)">
      <text x="0" y="0" class="math-rm" font-size="24">=</text>

      <!-- 1/2 m v^2 -->
      <text x="28" y="-9" text-anchor="middle" class="math-rm blue" font-size="17">1</text>
      <line x1="20" y1="-5" x2="36" y2="-5" stroke="#1261a0" stroke-width="1.5" />
      <text x="28" y="11" text-anchor="middle" class="math-rm blue" font-size="17">2</text>
      <text x="44" y="0" class="math blue" font-size="25">mv</text>
      <text x="73" y="-11" class="math-rm blue" font-size="15">2</text>

      <text x="94" y="0" class="math-rm" font-size="24">+</text>

      <!-- 1/2 I omega^2 -->
      <text x="122" y="-9" text-anchor="middle" class="math-rm teal" font-size="17">1</text>
      <line x1="114" y1="-5" x2="130" y2="-5" stroke="#14736b" stroke-width="1.5" />
      <text x="122" y="11" text-anchor="middle" class="math-rm teal" font-size="17">2</text>
      <text x="138" y="0" class="math teal" font-size="25">Iω</text>
      <text x="166" y="-11" class="math-rm teal" font-size="15">2</text>
    </g>

    <!-- Kreska podziału -->
    <line x1="24" y1="150" x2="486" y2="150" stroke="#cbd2d8" stroke-width="1.2" />

    <!-- Pasek wizualny podziału energii dla walca pełnego (I = 1/2 mR^2) -->
    <text x="24" y="174" class="text-body">Podział energii dla walca pełnego (<tspan class="math teal">I = </tspan><tspan class="math-rm teal">½</tspan><tspan class="math teal">mR</tspan><tspan class="math-rm teal" font-size="11" dy="-5">2</tspan><tspan dy="5">):</tspan></text>

    <!-- Belka sumaryczna: 2/3 (66.7%) postępowa + 1/3 (33.3%) obrotowa -->
    <g transform="translate(24, 186)">
      <rect x="0" y="0" width="308" height="28" rx="5" fill="#1261a0" />
      <rect x="308" y="0" width="154" height="28" rx="5" fill="#14736b" />
      <text x="154" y="19" text-anchor="middle" fill="#ffffff" class="math-rm" font-size="13.5" font-weight="600">Ruch postępowy (⅔ ≈ 66,7%)</text>
      <text x="385" y="19" text-anchor="middle" fill="#ffffff" class="math-rm" font-size="13.5" font-weight="600">Obrót (⅓ ≈ 33,3%)</text>
    </g>
    <text x="24" y="230" class="text-muted">Podstawienie: <tspan class="math">E</tspan><tspan class="math-rm" font-size="11" dy="2">k</tspan><tspan dy="-2"> = ½mv² + ½(½mR²)(v/R)² = ½mv² + ¼mv² = </tspan><tspan class="math blue">¾mv²</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- DOLNE KARTY: DWA KLUCZOWE PRZYKŁADY MATURALNE                          -->
  <!-- ===================================================================== -->

  <!-- Karta I: Kula pełna -->
  <g transform="translate(48, 305)">
    <rect x="0" y="0" width="445" height="135" class="card" />
    <text x="22" y="28" class="text-heading">1. Kula pełna (<tspan class="math teal">I = </tspan><tspan class="math-rm teal">⅖</tspan><tspan class="math teal">mR</tspan><tspan class="math-rm teal" font-size="11" dy="-5">2</tspan><tspan dy="5">)</tspan></text>

    <text x="22" y="56" class="text-body">Podstawienie związku <tspan class="math teal">ω = v/R</tspan> do energii obrotu:</text>
    <g transform="translate(22, 90)">
      <text x="0" y="0" class="math teal" font-size="19">E</text>
      <text x="12" y="4" class="math-rm teal" font-size="13">k,obr</text>
      <text x="46" y="0" class="math-rm" font-size="18">=</text>

      <text x="64" y="0" class="math-rm" font-size="18">½ · (⅖<tspan class="math teal">mR</tspan>²) · (<tspan class="math teal">v/R</tspan>)²</text>
      <text x="208" y="0" class="math-rm" font-size="18">=</text>
      <!-- 1/5 m v^2 -->
      <text x="230" y="-8" text-anchor="middle" class="math-rm teal" font-size="15">1</text>
      <line x1="223" y1="-5" x2="237" y2="-5" stroke="#14736b" stroke-width="1.4" />
      <text x="230" y="11" text-anchor="middle" class="math-rm teal" font-size="15">5</text>
      <text x="242" y="0" class="math teal" font-size="19">mv</text>
      <text x="266" y="-8" class="math-rm teal" font-size="12">2</text>
    </g>
    <text x="22" y="120" class="text-body">Całkowita energia: <tspan class="math blue">E</tspan><tspan class="math-rm blue" font-size="11" dy="2">k</tspan><tspan dy="-2"> = ½mv² + ⅕mv² = </tspan><tspan class="math blue" font-size="17">0,7 mv²</tspan> (<tspan class="text-muted">71,4% postępowa</tspan>)</text>
  </g>

  <!-- Karta II: Walec pełny -->
  <g transform="translate(531, 305)">
    <rect x="0" y="0" width="445" height="135" class="card" />
    <text x="22" y="28" class="text-heading">2. Walec pełny (<tspan class="math teal">I = </tspan><tspan class="math-rm teal">½</tspan><tspan class="math teal">mR</tspan><tspan class="math-rm teal" font-size="11" dy="-5">2</tspan><tspan dy="5">)</tspan></text>

    <text x="22" y="56" class="text-body">Podstawienie związku <tspan class="math teal">ω = v/R</tspan> do energii obrotu:</text>
    <g transform="translate(22, 90)">
      <text x="0" y="0" class="math teal" font-size="19">E</text>
      <text x="12" y="4" class="math-rm teal" font-size="13">k,obr</text>
      <text x="46" y="0" class="math-rm" font-size="18">=</text>

      <text x="64" y="0" class="math-rm" font-size="18">½ · (½<tspan class="math teal">mR</tspan>²) · (<tspan class="math teal">v/R</tspan>)²</text>
      <text x="206" y="0" class="math-rm" font-size="18">=</text>
      <!-- 1/4 m v^2 -->
      <text x="228" y="-8" text-anchor="middle" class="math-rm teal" font-size="15">1</text>
      <line x1="221" y1="-5" x2="235" y2="-5" stroke="#14736b" stroke-width="1.4" />
      <text x="228" y="11" text-anchor="middle" class="math-rm teal" font-size="15">4</text>
      <text x="240" y="0" class="math teal" font-size="19">mv</text>
      <text x="264" y="-8" class="math-rm teal" font-size="12">2</text>
    </g>
    <text x="22" y="120" class="text-body">Całkowita energia: <tspan class="math blue">E</tspan><tspan class="math-rm blue" font-size="11" dy="2">k</tspan><tspan dy="-2"> = ½mv² + ¼mv² = </tspan><tspan class="math blue" font-size="17">0,75 mv²</tspan> (<tspan class="text-muted">66,7% postępowa</tspan>)</text>
  </g>
</svg>
