<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 445" width="1024" height="445">
  <defs>
    <!-- Marker strzałki obrotu (ciemny granat #182c40) -->
    <marker id="arr-dark" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto">
      <polygon points="0 0, 7 2.75, 0 5.5" fill="#182c40" />
    </marker>
    <!-- Marker strzałki wymiarowej / promienia (zielony #14736b) -->
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14736b" />
    </marker>

    <style>
      .math {
        font-family: 'KaTeX_Math', 'Latin Modern Math', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: italic;
        fill: #182c40;
      }
      .math-rm {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: normal;
        fill: #182c40;
      }
      .label-title {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 17px;
        fill: #182c40;
      }
      .label-sub {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 14px;
        fill: #64778a;
      }
      .blue { fill: #1261a0; }
      .teal { fill: #14736b; }
      .orange { fill: #b65512; }
      .slate { fill: #64778a; }

      .body-light { fill: #f5f8fb; stroke: #64778a; stroke-width: 2; }
      .body-side  { fill: #e6eef5; stroke: #64778a; stroke-width: 2; }
      .body-dense { fill: #dce5ed; stroke: #64778a; stroke-width: 2; }
      .axis-solid { stroke: #182c40; stroke-width: 1.8; stroke-linecap: round; }
      .axis-dash  { stroke: #64778a; stroke-width: 1.6; stroke-dasharray: 5, 5; }
      .dim-line   { stroke: #768798; stroke-width: 1.3; }
      .wit-line   { stroke: #cbd2d8; stroke-width: 1.2; }
      .card       { fill: #f2f6f9; rx: 11px; }
    </style>
  </defs>

  <!-- Tło -->
  <rect width="1024" height="445" fill="#ffffff" />

  <!-- ===================================================================== -->
  <!-- 1. OBRĘCZ CIENKOŚCIENNA (x = 136)                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(136, 0)">
    <!-- Oś obrotu (góra) -->
    <line x1="0" y1="30" x2="0" y2="128" class="axis-solid" />

    <!-- Strzałka prędkości kątowej omega -->
    <path d="M -16 55 A 20 7.5 0 1 1 16 47" fill="none" stroke="#182c40" stroke-width="1.6" marker-end="url(#arr-dark)" />
    <text x="23" y="55" class="math" font-size="20">ω</text>

    <!-- Obręcz 3D (pierścień o grubości ścianki i pustym wnętrzu) -->
    <!-- Zewnętrzna ścianka boczna na dole -->
    <path d="M -82 162 L -82 175 A 82 34 0 0 0 82 175 L 82 162 Z" class="body-side" stroke-linejoin="round" />
    <!-- Górna tafla pierścienia -->
    <ellipse cx="0" cy="162" rx="82" ry="34" class="body-dense" />
    <!-- Wnętrze pierścienia (puste białe) -->
    <ellipse cx="0" cy="162" rx="64" ry="25" fill="#ffffff" stroke="#64778a" stroke-width="1.8" />
    <!-- Wewnętrzna tylna ścianka pierścienia (efekt głębi 3D) -->
    <path d="M -62 166 A 64 25 0 0 1 62 166" fill="none" stroke="#92a0ae" stroke-width="1.4" />

    <!-- Oś obrotu przez środek pierścienia i poniżej -->
    <line x1="0" y1="128" x2="0" y2="209" class="axis-dash" />
    <line x1="0" y1="209" x2="0" y2="275" class="axis-solid" />

    <!-- Środek O oraz promień R -->
    <circle cx="0" cy="162" r="4" fill="#182c40" />
    <text x="-19" y="158" class="math" font-size="18">O</text>
    <line x1="0" y1="162" x2="71" y2="162" stroke="#14736b" stroke-width="2.2" marker-end="url(#arr-teal)" />
    <text x="28" y="155" class="math teal" font-size="19">R</text>
    <text x="-66" y="122" class="math slate" font-size="18">m</text>

    <!-- Karta z podpisem i wzorem -->
    <rect x="-112" y="300" width="224" height="122" class="card" />
    <text x="0" y="328" text-anchor="middle" class="label-title">Obręcz cienkościenna</text>
    <text x="0" y="348" text-anchor="middle" class="label-sub">(cała masa w odl. R od osi)</text>

    <!-- Wzór: I_0 = m R^2 -->
    <g transform="translate(0, 392)">
      <text x="-44" y="0" class="math blue" font-size="24">I</text>
      <text x="-34" y="6" class="math-rm blue" font-size="15">0</text>
      <text x="-18" y="0" class="math-rm blue" font-size="23">=</text>
      <text x="4" y="0" class="math blue" font-size="24">mR</text>
      <text x="41" y="-11" class="math-rm blue" font-size="15">2</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 2. WALEC / KRĄŻEK PEŁNY (x = 386)                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(386, 0)">
    <!-- Oś obrotu (góra) -->
    <line x1="0" y1="30" x2="0" y2="132" class="axis-solid" />

    <!-- Strzałka prędkości kątowej omega -->
    <path d="M -16 55 A 20 7.5 0 1 1 16 47" fill="none" stroke="#182c40" stroke-width="1.6" marker-end="url(#arr-dark)" />
    <text x="23" y="55" class="math" font-size="20">ω</text>

    <!-- Boczna powierzchnia walca -->
    <path d="M -78 132 L -78 198 A 78 28 0 0 0 78 198 L 78 132 Z" class="body-side" />
    <!-- Tylny łuk podstawy dolnej (przerywany) -->
    <path d="M -78 198 A 78 28 0 0 1 78 198" fill="none" stroke="#92a0ae" stroke-width="1.4" stroke-dasharray="5,5" />
    <!-- Górna podstawa walca -->
    <ellipse cx="0" cy="132" rx="78" ry="28" class="body-light" />

    <!-- Oś obrotu wewnątrz i pod walcem -->
    <line x1="0" y1="132" x2="0" y2="226" class="axis-dash" />
    <line x1="0" y1="226" x2="0" y2="275" class="axis-solid" />

    <!-- Środek O i promień R na górnej podstawie -->
    <circle cx="0" cy="132" r="4" fill="#182c40" />
    <text x="-19" y="130" class="math" font-size="18">O</text>
    <line x1="0" y1="132" x2="70" y2="132" stroke="#14736b" stroke-width="2.2" marker-end="url(#arr-teal)" />
    <text x="30" y="125" class="math teal" font-size="19">R</text>
    <text x="-55" y="182" class="math slate" font-size="18">m</text>

    <!-- Karta z podpisem i wzorem -->
    <rect x="-112" y="300" width="224" height="122" class="card" />
    <text x="0" y="328" text-anchor="middle" class="label-title">Walec / krążek pełny</text>
    <text x="0" y="348" text-anchor="middle" class="label-sub">(oś symetrii walca)</text>

    <!-- Wzór: I_0 = 1/2 m R^2 -->
    <g transform="translate(0, 392)">
      <text x="-56" y="0" class="math blue" font-size="24">I</text>
      <text x="-46" y="6" class="math-rm blue" font-size="15">0</text>
      <text x="-30" y="0" class="math-rm blue" font-size="23">=</text>
      <!-- Ułamek 1/2 -->
      <text x="-3" y="-10" text-anchor="middle" class="math-rm blue" font-size="18">1</text>
      <line x1="-12" y1="-6" x2="6" y2="-6" stroke="#1261a0" stroke-width="1.6" />
      <text x="-3" y="13" text-anchor="middle" class="math-rm blue" font-size="18">2</text>
      <text x="11" y="0" class="math blue" font-size="24">mR</text>
      <text x="48" y="-11" class="math-rm blue" font-size="15">2</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 3. KULA PEŁNA (x = 636)                                                -->
  <!-- ===================================================================== -->
  <g transform="translate(636, 0)">
    <!-- Oś obrotu (góra) -->
    <line x1="0" y1="30" x2="0" y2="96" class="axis-solid" />

    <!-- Strzałka prędkości kątowej omega -->
    <path d="M -16 55 A 20 7.5 0 1 1 16 47" fill="none" stroke="#182c40" stroke-width="1.6" marker-end="url(#arr-dark)" />
    <text x="23" y="55" class="math" font-size="20">ω</text>

    <!-- Czasza kuli -->
    <circle cx="0" cy="166" r="70" class="body-light" />
    <!-- Równik kuli (tył przerywany, przód ciągły) -->
    <path d="M -70 166 A 70 22 0 0 1 70 166" fill="none" stroke="#92a0ae" stroke-width="1.4" stroke-dasharray="5,5" />
    <path d="M -70 166 A 70 22 0 0 0 70 166" fill="none" stroke="#64778a" stroke-width="1.8" />

    <!-- Oś obrotu wewnątrz i pod kulą -->
    <line x1="0" y1="96" x2="0" y2="236" class="axis-dash" />
    <line x1="0" y1="236" x2="0" y2="275" class="axis-solid" />

    <!-- Środek O i promień R -->
    <circle cx="0" cy="166" r="4" fill="#182c40" />
    <text x="-19" y="162" class="math" font-size="18">O</text>
    <line x1="0" y1="166" x2="62" y2="166" stroke="#14736b" stroke-width="2.2" marker-end="url(#arr-teal)" />
    <text x="28" y="158" class="math teal" font-size="19">R</text>
    <text x="-48" y="132" class="math slate" font-size="18">m</text>

    <!-- Karta z podpisem i wzorem -->
    <rect x="-112" y="300" width="224" height="122" class="card" />
    <text x="0" y="328" text-anchor="middle" class="label-title">Kula pełna</text>
    <text x="0" y="348" text-anchor="middle" class="label-sub">(oś przez środek kuli)</text>

    <!-- Wzór: I_0 = 2/5 m R^2 -->
    <g transform="translate(0, 392)">
      <text x="-56" y="0" class="math blue" font-size="24">I</text>
      <text x="-46" y="6" class="math-rm blue" font-size="15">0</text>
      <text x="-30" y="0" class="math-rm blue" font-size="23">=</text>
      <!-- Ułamek 2/5 -->
      <text x="-3" y="-10" text-anchor="middle" class="math-rm blue" font-size="18">2</text>
      <line x1="-12" y1="-6" x2="6" y2="-6" stroke="#1261a0" stroke-width="1.6" />
      <text x="-3" y="13" text-anchor="middle" class="math-rm blue" font-size="18">5</text>
      <text x="11" y="0" class="math blue" font-size="24">mR</text>
      <text x="48" y="-11" class="math-rm blue" font-size="15">2</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 4. CIENKI PRĘT (x = 886)                                               -->
  <!-- ===================================================================== -->
  <g transform="translate(886, 0)">
    <!-- Oś obrotu prostopadła przez środek pręta -->
    <line x1="0" y1="30" x2="0" y2="158" class="axis-solid" />
    <line x1="0" y1="172" x2="0" y2="275" class="axis-solid" />

    <!-- Strzałka prędkości kątowej omega -->
    <path d="M -16 55 A 20 7.5 0 1 1 16 47" fill="none" stroke="#182c40" stroke-width="1.6" marker-end="url(#arr-dark)" />
    <text x="23" y="55" class="math" font-size="20">ω</text>

    <!-- Pręt poziomy o długości L -->
    <rect x="-86" y="158" width="172" height="14" rx="2" class="body-dense" />
    <circle cx="0" cy="165" r="4" fill="#182c40" />
    <text x="-18" y="148" class="math" font-size="18">O</text>
    <text x="52" y="148" class="math slate" font-size="18">m</text>

    <!-- Linie wymiarowe L (styl z ukośnymi kreskami architektonicznymi) -->
    <line x1="-86" y1="176" x2="-86" y2="225" class="wit-line" />
    <line x1="86" y1="176" x2="86" y2="225" class="wit-line" />
    <line x1="-86" y1="212" x2="86" y2="212" class="dim-line" />
    <!-- Ukośne znaczniki wymiarowe -->
    <line x1="-90" y1="216" x2="-82" y2="208" stroke="#64778a" stroke-width="1.4" />
    <line x1="82" y1="216" x2="90" y2="208" stroke="#64778a" stroke-width="1.4" />
    <text x="14" y="234" text-anchor="middle" class="math teal" font-size="19">L</text>

    <!-- Karta z podpisem i wzorem -->
    <rect x="-112" y="300" width="224" height="122" class="card" />
    <text x="0" y="328" text-anchor="middle" class="label-title">Cienki pręt</text>
    <text x="0" y="348" text-anchor="middle" class="label-sub">(oś prostopadła przez środek)</text>

    <!-- Wzór: I_0 = 1/12 m L^2 -->
    <g transform="translate(0, 392)">
      <text x="-60" y="0" class="math blue" font-size="24">I</text>
      <text x="-50" y="6" class="math-rm blue" font-size="15">0</text>
      <text x="-34" y="0" class="math-rm blue" font-size="23">=</text>
      <!-- Ułamek 1/12 -->
      <text x="-3" y="-10" text-anchor="middle" class="math-rm blue" font-size="18">1</text>
      <line x1="-15" y1="-6" x2="9" y2="-6" stroke="#1261a0" stroke-width="1.6" />
      <text x="-3" y="13" text-anchor="middle" class="math-rm blue" font-size="18">12</text>
      <text x="14" y="0" class="math blue" font-size="24">mL</text>
      <text x="48" y="-11" class="math-rm blue" font-size="15">2</text>
    </g>
  </g>
</svg>
