<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 495" width="1024" height="495">
  <defs>
    <!-- Markery strzałek -->
    <marker id="arr-dark" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto">
      <polygon points="0 0, 7 2.75, 0 5.5" fill="#182c40" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto">
      <polygon points="0 0, 7 2.75, 0 5.5" fill="#1261a0" />
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b65512" />
    </marker>
    <marker id="arr-orange-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#b65512" />
    </marker>

    <style>
      .math {
        font-family: 'KaTeX_Math', 'Latin Modern Math', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: italic;
        fill: #182c40;
      }
      .math-rm {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-style: normal;
        fill: #182c40;
      }
      .text-heading {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 18px;
        fill: #182c40;
      }
      .text-body {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 15.5px;
        fill: #182c40;
      }
      .text-muted {
        font-family: 'KaTeX_Main', 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif;
        font-size: 14.5px;
        fill: #64778a;
      }

      .blue   { fill: #1261a0; }
      .teal   { fill: #14736b; }
      .orange { fill: #b65512; }
      .slate  { fill: #64778a; }

      .body-light { fill: #f5f8fb; stroke: #64778a; stroke-width: 2; }
      .body-side  { fill: #e6eef5; stroke: #64778a; stroke-width: 2; }
      .body-dense { fill: #dce5ed; stroke: #64778a; stroke-width: 2; }
      .dim-line   { stroke: #768798; stroke-width: 1.4; }
      .wit-line   { stroke: #cbd2d8; stroke-width: 1.3; }
      .card       { fill: #f2f6f9; rx: 12px; }
    </style>
  </defs>

  <!-- Tło -->
  <rect width="1024" height="495" fill="#ffffff" />

  <!-- ===================================================================== -->
  <!-- LEWA STRONA: SCHEMAT OGÓLNY TWIERDZENIA STEINERA (WALEC / TARCZA)     -->
  <!-- ===================================================================== -->
  <g transform="translate(250, 0)">
    <!-- 1. Oś przez środek masy S (zielona / morska #14736b, przerywana) -->
    <line x1="0" y1="36" x2="0" y2="145" stroke="#14736b" stroke-width="2" stroke-dasharray="6,5" />
    <text x="-4" y="27" text-anchor="end" class="math teal" font-size="22">I</text>
    <text x="-2" y="33" class="math-rm teal" font-size="14">0</text>
    <text x="-12" y="56" text-anchor="end" class="text-muted teal">oś przez środek masy S</text>

    <!-- 2. Nowa oś równoległa O przesunięta o d (niebieska #1261a0, ciągła) -->
    <line x1="115" y1="36" x2="115" y2="145" stroke="#1261a0" stroke-width="2.4" />
    <!-- Strzałka obrotu wokół nowej osi O -->
    <path d="M 97 60 A 21 8 0 1 1 132 52" fill="none" stroke="#1261a0" stroke-width="1.7" marker-end="url(#arr-blue)" />
    <text x="140" y="60" class="math blue" font-size="20">ω</text>
    <text x="115" y="27" text-anchor="middle" class="math blue" font-size="22">I</text>
    <text x="130" y="86" class="text-muted blue">nowa oś równoległa</text>

    <!-- Wymiar odległości d między osiami równoległymi (u góry) -->
    <line x1="3" y1="102" x2="112" y2="102" stroke="#b65512" stroke-width="2" marker-start="url(#arr-orange-rev)" marker-end="url(#arr-orange)" />
    <!-- Znaczniki kąta prostego między osią a odcinkiem d -->
    <polyline points="0,92 10,92 10,102" fill="none" stroke="#92a0ae" stroke-width="1.3" />
    <polyline points="115,92 105,92 105,102" fill="none" stroke="#92a0ae" stroke-width="1.3" />
    <text x="57" y="92" text-anchor="middle" class="math orange" font-size="21">d</text>

    <!-- Bryła (walec / tarcza o masie m i promieniu R) -->
    <path d="M -115 145 L -115 205 A 115 38 0 0 0 115 205 L 115 145 Z" class="body-side" />
    <path d="M -115 205 A 115 38 0 0 1 115 205" fill="none" stroke="#92a0ae" stroke-width="1.4" stroke-dasharray="5,5" />
    <ellipse cx="0" cy="145" rx="115" ry="38" class="body-light" />

    <!-- Wewnętrzne i dolne przedłużenia obu osi równoległych -->
    <line x1="0" y1="145" x2="0" y2="243" stroke="#14736b" stroke-width="1.8" stroke-dasharray="5,5" />
    <line x1="0" y1="243" x2="0" y2="288" stroke="#14736b" stroke-width="2" stroke-dasharray="6,5" />

    <line x1="115" y1="145" x2="115" y2="205" stroke="#1261a0" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="115" y1="205" x2="115" y2="288" stroke="#1261a0" stroke-width="2.4" />

    <!-- Odcinek d na powierzchni tarczy łączący S i O -->
    <line x1="0" y1="145" x2="115" y2="145" stroke="#b65512" stroke-width="2.4" />
    <circle cx="0" cy="145" r="4.5" fill="#14736b" />
    <text x="-18" y="151" class="math teal" font-size="19">S</text>

    <circle cx="115" cy="145" r="4.5" fill="#1261a0" />
    <text x="125" y="151" class="math blue" font-size="19">O</text>

    <text x="57" y="167" text-anchor="middle" class="math orange" font-size="18">d = R</text>
    <text x="-75" y="151" class="math slate" font-size="19">m</text>
  </g>

  <!-- ===================================================================== -->
  <!-- PRAWA STRONA: PRZYKŁAD DLA CIENKIEGO PRĘTA (OŚ NA KOŃCU, d = L/2)     -->
  <!-- ===================================================================== -->
  <g transform="translate(745, 0)">
    <!-- Wymiar całkowity L na górze (jak w rigid-beam-equilibrium.png) -->
    <line x1="-130" y1="68" x2="-130" y2="152" class="wit-line" />
    <line x1="130" y1="68" x2="130" y2="152" class="wit-line" />
    <line x1="-130" y1="82" x2="130" y2="82" class="dim-line" />
    <line x1="-134" y1="86" x2="-126" y2="78" stroke="#64778a" stroke-width="1.4" />
    <line x1="126" y1="86" x2="134" y2="78" stroke="#64778a" stroke-width="1.4" />
    <text x="0" y="72" text-anchor="middle" class="math" font-size="19">L</text>

    <!-- 1. Oś przez środek masy S (x = 0, zielona przerywana) -->
    <line x1="0" y1="95" x2="0" y2="158" stroke="#14736b" stroke-width="2" stroke-dasharray="6,5" />
    <line x1="0" y1="172" x2="0" y2="288" stroke="#14736b" stroke-width="2" stroke-dasharray="6,5" />
    <text x="10" y="116" class="math teal" font-size="21">I</text>
    <text x="20" y="122" class="math-rm teal" font-size="14">0</text>

    <!-- 2. Nowa oś obrotu na końcu pręta O (x = -130, niebieska ciągła) -->
    <line x1="-130" y1="36" x2="-130" y2="158" stroke="#1261a0" stroke-width="2.4" />
    <line x1="-130" y1="172" x2="-130" y2="288" stroke="#1261a0" stroke-width="2.4" />
    <path d="M -148 60 A 21 8 0 1 1 -113 52" fill="none" stroke="#1261a0" stroke-width="1.7" marker-end="url(#arr-blue)" />
    <text x="-105" y="60" class="math blue" font-size="20">ω</text>
    <text x="-130" y="27" text-anchor="middle" class="math blue" font-size="22">I</text>

    <!-- Pręt o masie m i długości L -->
    <rect x="-130" y="158" width="260" height="14" rx="2" class="body-dense" />

    <!-- Punkty O (koniec) oraz S (środek masy) -->
    <circle cx="-130" cy="165" r="4.5" fill="#1261a0" />
    <text x="-152" y="170" class="math blue" font-size="19">O</text>

    <circle cx="0" cy="165" r="4.5" fill="#14736b" />
    <text x="8" y="150" class="math teal" font-size="19">S</text>
    <text x="72" y="150" class="math slate" font-size="19">m</text>

    <!-- Wymiar przesunięcia osi d = L/2 pod prętem -->
    <line x1="-127" y1="222" x2="-3" y2="222" stroke="#b65512" stroke-width="2" marker-start="url(#arr-orange-rev)" marker-end="url(#arr-orange)" />
    <text x="-65" y="248" text-anchor="middle" class="math orange" font-size="19">d = L/<tspan class="math-rm orange" font-size="18">2</tspan></text>
  </g>

  <!-- ===================================================================== -->
  <!-- DOLNE KARTY PODSUMOWUJĄCE (dokładnie w stylu rigid-beam-equilibrium)  -->
  <!-- ===================================================================== -->

  <!-- Karta I (lewa): Twierdzenie Steinera i oznaczenia -->
  <g transform="translate(48, 315)">
    <rect x="0" y="0" width="435" height="155" class="card" />
    <text x="24" y="34" class="text-heading">I. Twierdzenie Steinera (o osiach równoległych)</text>

    <!-- Główny wzór: I = I_0 + m d^2 -->
    <g transform="translate(28, 76)">
      <text x="0" y="0" class="math blue" font-size="28">I</text>
      <text x="24" y="0" class="math-rm" font-size="26">=</text>
      <text x="54" y="0" class="math teal" font-size="28">I</text>
      <text x="64" y="6" class="math-rm teal" font-size="17">0</text>
      <text x="85" y="0" class="math-rm" font-size="26">+</text>
      <text x="114" y="0" class="math" font-size="28">m</text>
      <text x="139" y="0" class="math orange" font-size="28">d</text>
      <text x="155" y="-12" class="math-rm orange" font-size="17">2</text>
    </g>

    <!-- Opis symboli -->
    <text x="24" y="114" class="text-body">
      <tspan class="math teal">I</tspan><tspan class="math-rm teal" font-size="12" dy="4">0</tspan><tspan dy="-4" dx="5">– moment względem osi przez środek masy</tspan><tspan class="math teal" dx="5">S</tspan>
    </text>
    <text x="24" y="138" class="text-body">
      <tspan class="math orange">d</tspan><tspan dx="5">– odległość między osiami równoległymi,</tspan><tspan class="math" dx="5">m</tspan><tspan dx="5">– masa bryły</tspan>
    </text>
  </g>

  <!-- Karta II (prawa): Przykłady wyznaczenia I z twierdzenia Steinera -->
  <g transform="translate(508, 315)">
    <rect x="0" y="0" width="468" height="155" class="card" />
    <text x="22" y="34" class="text-heading">II. Przykłady przesunięcia osi obrotu</text>

    <!-- Przykład 1: Walec wokół krawędzi (d = R) -->
    <text x="22" y="75" class="text-body">Walec (<tspan class="math orange">d = R</tspan>):</text>
    <g transform="translate(152, 75)">
      <text x="0" y="0" class="math blue" font-size="20">I</text>
      <text x="15" y="0" class="math-rm" font-size="19">=</text>
      <!-- 1/2 -->
      <text x="38" y="-8" text-anchor="middle" class="math-rm teal" font-size="15">1</text>
      <line x1="31" y1="-5" x2="45" y2="-5" stroke="#14736b" stroke-width="1.4" />
      <text x="38" y="11" text-anchor="middle" class="math-rm teal" font-size="15">2</text>
      <text x="49" y="0" class="math teal" font-size="19">mR</text>
      <text x="78" y="-9" class="math-rm teal" font-size="13">2</text>
      <text x="90" y="0" class="math-rm" font-size="19">+</text>
      <text x="108" y="0" class="math orange" font-size="19">mR</text>
      <text x="137" y="-9" class="math-rm orange" font-size="13">2</text>
      <text x="149" y="0" class="math-rm" font-size="19">=</text>
      <!-- 3/2 mR^2 -->
      <text x="172" y="-8" text-anchor="middle" class="math-rm blue" font-size="15">3</text>
      <line x1="165" y1="-5" x2="179" y2="-5" stroke="#1261a0" stroke-width="1.4" />
      <text x="172" y="11" text-anchor="middle" class="math-rm blue" font-size="15">2</text>
      <text x="183" y="0" class="math blue" font-size="19">mR</text>
      <text x="212" y="-9" class="math-rm blue" font-size="13">2</text>
    </g>

    <!-- Przykład 2: Pręt wokół końca (d = L/2) -->
    <text x="22" y="125" class="text-body">Pręt (<tspan class="math orange">d = L/</tspan><tspan class="math-rm orange">2</tspan>):</text>
    <g transform="translate(152, 125)">
      <text x="0" y="0" class="math blue" font-size="20">I</text>
      <text x="15" y="0" class="math-rm" font-size="19">=</text>
      <!-- 1/12 -->
      <text x="40" y="-8" text-anchor="middle" class="math-rm teal" font-size="15">1</text>
      <line x1="30" y1="-5" x2="50" y2="-5" stroke="#14736b" stroke-width="1.4" />
      <text x="40" y="11" text-anchor="middle" class="math-rm teal" font-size="15">12</text>
      <text x="53" y="0" class="math teal" font-size="19">mL</text>
      <text x="80" y="-9" class="math-rm teal" font-size="13">2</text>
      <text x="91" y="0" class="math-rm" font-size="19">+</text>
      <!-- 1/4 -->
      <text x="113" y="-8" text-anchor="middle" class="math-rm orange" font-size="15">1</text>
      <line x1="106" y1="-5" x2="120" y2="-5" stroke="#b65512" stroke-width="1.4" />
      <text x="113" y="11" text-anchor="middle" class="math-rm orange" font-size="15">4</text>
      <text x="123" y="0" class="math orange" font-size="19">mL</text>
      <text x="150" y="-9" class="math-rm orange" font-size="13">2</text>
      <text x="161" y="0" class="math-rm" font-size="19">=</text>
      <!-- 1/3 mL^2 -->
      <text x="183" y="-8" text-anchor="middle" class="math-rm blue" font-size="15">1</text>
      <line x1="176" y1="-5" x2="190" y2="-5" stroke="#1261a0" stroke-width="1.4" />
      <text x="183" y="11" text-anchor="middle" class="math-rm blue" font-size="15">3</text>
      <text x="194" y="0" class="math blue" font-size="19">mL</text>
      <text x="221" y="-9" class="math-rm blue" font-size="13">2</text>
    </g>
  </g>
</svg>
