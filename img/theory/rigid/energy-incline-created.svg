<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>Porównanie staczania brył z tej samej wysokości</title><desc>Porównanie staczania brył z tej samej wysokości; schemat zależności fizycznych.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1261a0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14736b"/></marker></defs><rect width="1200" height="470" fill="white"/><g font-family="Latin Modern Roman,Times New Roman,serif"><path d="M75 130L375 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M75 330L375 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M75 130L75 330" fill="none" stroke="#a7b4c0" stroke-width="2" stroke-dasharray="7 7"/><text x="53" y="240" text-anchor="middle" fill="#182c40" font-size="25">h</text><circle cx="285" cy="227.93" r="35" fill="#f5f8fb" stroke="#64778a" stroke-width="2"/><text x="230" y="80" text-anchor="middle" fill="#182c40" font-size="25">kula pełna</text><text x="230" y="390" text-anchor="middle" fill="#182c40" font-size="25">1.  v = √(10gh/7)</text><text x="230" y="425" text-anchor="middle" fill="#182c40" font-size="25">c = 0,4</text><path d="M465 130L765 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M465 330L765 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M465 130L465 330" fill="none" stroke="#a7b4c0" stroke-width="2" stroke-dasharray="7 7"/><text x="443" y="240" text-anchor="middle" fill="#182c40" font-size="25">h</text><circle cx="675" cy="227.93" r="35" fill="#f5f8fb" stroke="#64778a" stroke-width="2"/><text x="620" y="80" text-anchor="middle" fill="#182c40" font-size="25">walec pełny</text><text x="620" y="390" text-anchor="middle" fill="#182c40" font-size="25">2.  v = √(4gh/3)</text><text x="620" y="425" text-anchor="middle" fill="#182c40" font-size="25">c = 0,5</text><path d="M855 130L1155 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M855 330L1155 330" fill="none" stroke="#64778a" stroke-width="2" /><path d="M855 130L855 330" fill="none" stroke="#a7b4c0" stroke-width="2" stroke-dasharray="7 7"/><text x="833" y="240" text-anchor="middle" fill="#182c40" font-size="25">h</text><circle cx="1065" cy="227.93" r="35" fill="#f5f8fb" stroke="#64778a" stroke-width="2"/><circle cx="1065" cy="227.93" r="24" fill="#f5f8fb" stroke="#64778a" stroke-width="2"/><text x="1010" y="80" text-anchor="middle" fill="#182c40" font-size="25">pierścień</text><text x="1010" y="390" text-anchor="middle" fill="#182c40" font-size="25">3.  v = √(gh)</text><text x="1010" y="425" text-anchor="middle" fill="#182c40" font-size="25">c = 1</text></g></svg>