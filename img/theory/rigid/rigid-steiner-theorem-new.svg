<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img">
  <title>Twierdzenie Steinera</title>
  <desc>Ta sama bryła z osią obrotu przez środek masy oraz z osią równoległą przesuniętą o odległość d; pokazano zależność I = I₀ + md².</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1261a0"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b65512"/></marker>
    <style><![CDATA[
      .body{fill:#f5f8fb;stroke:#64778a;stroke-width:2}.axis{stroke:#1261a0;stroke-width:3;marker-end:url(#blue)}.axis2{stroke:#b65512;stroke-width:3;marker-end:url(#orange)}.guide{stroke:#a7b4c0;stroke-width:1.5;stroke-dasharray:8 7}.dim{stroke:#14736b;stroke-width:2.5;marker-start:url(#blue);marker-end:url(#blue)}.label{font-family:'Latin Modern Roman','Times New Roman',serif;fill:#182c40;font-size:27px}.math{font-family:'Latin Modern Math','STIX Two Math','Times New Roman',serif;font-style:italic;fill:#182c40;font-size:35px}.note{font-family:'Latin Modern Roman','Times New Roman',serif;fill:#182c40;font-size:22px}
    ]]></style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <g transform="translate(600 260)">
    <rect x="-175" y="-95" width="350" height="190" rx="18" class="body"/><circle cx="0" cy="0" r="8" fill="#14736b"/>
    <line x1="-260" y1="0" x2="260" y2="0" class="axis"/><line x1="110" y1="-175" x2="110" y2="175" class="axis2"/>
    <line x1="0" y1="-130" x2="0" y2="130" class="guide"/><line x1="110" y1="-130" x2="110" y2="130" class="guide"/>
    <line x1="0" y1="145" x2="110" y2="145" class="dim"/>
    <text x="-18" y="-24" text-anchor="end" class="label">S</text><text x="-12" y="-145" text-anchor="middle" class="math">oś przez S</text><text x="110" y="-190" text-anchor="middle" class="math">oś ′</text><text x="55" y="180" text-anchor="middle" class="math">d</text>
    <text x="-105" y="-220" text-anchor="middle" class="label">oś przez środek masy</text><text x="205" y="220" text-anchor="middle" class="label">oś równoległa</text>
  </g>
  <text x="600" y="555" text-anchor="middle" class="math">I = I₀ + md²</text>
</svg>
