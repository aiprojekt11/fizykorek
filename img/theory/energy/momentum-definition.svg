<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Definicja pędu ciała</title>
  <desc id="desc">Pęd to iloczyn masy i prędkości ciała: p = m · v. Wektor pędu ma ten sam kierunek i zwrot co prędkość.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .formula { font-size: 26px; font-weight: 800; fill: #1e293b; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 600; }
      .muted { fill: #64748b; font-size: 14px; }
      .blue { fill: #2563eb; }
      .indigo { fill: #4f46e5; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 18px; }
      .surface { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; }
      .box { fill: url(#boxGrad); stroke: #2563eb; stroke-width: 3; rx: 12px; }
    </style>
  </defs>

  <!-- Tło panelu -->
  <rect class="panel" x="14" y="14" width="732" height="232" rx="18"/>

  <!-- Podłoże -->
  <line class="surface" x1="50" y1="190" x2="420" y2="190"/>

  <!-- Ciało o masie m -->
  <rect class="box" x="90" y="105" width="120" height="85" rx="12"/>
  <text class="t label" x="150" y="156" text-anchor="middle">masa m</text>

  <!-- Wektor prędkości v -->
  <line x1="210" y1="130" x2="340" y2="130" stroke="#2563eb" stroke-width="4.5" marker-end="url(#arrow-blue)"/>
  <text class="t small blue" x="270" y="118" text-anchor="middle">prędkość v⃗</text>

  <!-- Wektor pędu p (równoległy, ten sam zwrot) -->
  <line x1="210" y1="165" x2="385" y2="165" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow-indigo)"/>
  <text class="t small indigo" x="300" y="155" text-anchor="middle">pęd p⃗ = m · v⃗</text>

  <!-- Prawa strona: Karta ze wzorem i jednostką -->
  <rect x="460" y="38" width="260" height="184" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t formula" x="590" y="85" text-anchor="middle">p⃗ = m · v⃗</text>
  <line x1="485" y1="105" x2="695" y2="105" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="t label" x="590" y="138" text-anchor="middle" font-size="16px">Jednostka w SI:</text>
  <text class="t small indigo" x="590" y="166" text-anchor="middle" font-size="17px">[p] = kg · m/s</text>
  <text class="t muted" x="590" y="198" text-anchor="middle">kierunek i zwrot p⃗ zgodny z v⃗</text>
</svg>
